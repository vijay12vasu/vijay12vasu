<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { stroke: #e7e5e4; stroke-width: 1; fill: none; }
      .line-dashed { stroke: #d6d3d1; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
      .accent { fill: #d97706; }
      .accent-line { stroke: #d97706; stroke-width: 1; fill: none; }
      .meta { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        font-size: 8px; 
        font-weight: 600; 
        fill: #a8a29e; 
        letter-spacing: 2px; 
        text-transform: uppercase; 
      }
      
      @media (prefers-color-scheme: dark) {
        .line { stroke: #292524; }
        .line-dashed { stroke: #44403c; }
        .accent { fill: #fbbf24; }
        .accent-line { stroke: #fbbf24; }
        .meta { fill: #52525b; }
      }
    </style>
  </defs>

  <!-- Base Grid -->
  <circle cx="200" cy="200" r="160" class="line-dashed" />
  <circle cx="200" cy="200" r="100" class="line" />
  <circle cx="200" cy="200" r="40" class="line-dashed" />
  
  <path d="M 200 20 L 200 380 M 20 200 L 380 200" class="line" />

  <!-- Signal Vectors -->
  <path d="M 200 200 L 280 120 L 340 140" class="accent-line" />
  <circle cx="280" cy="120" r="3" class="accent" />
  <circle cx="340" cy="140" r="2" class="accent" />
  <text x="290" y="115" class="meta">SYSTEMS</text>

  <path d="M 200 200 L 140 80" class="line" />
  <circle cx="140" cy="80" r="2" fill="#a8a29e" />
  <text x="100" y="75" class="meta">SECURITY</text>

  <path d="M 200 200 L 80 280 L 120 320" class="line" />
  <circle cx="80" cy="280" r="2" fill="#a8a29e" />
  <text x="40" y="275" class="meta">AI</text>

  <path d="M 200 200 L 260 300" class="line" />
  <circle cx="260" cy="300" r="2" fill="#a8a29e" />
  <text x="270" y="305" class="meta">PERF</text>

  <!-- Origin -->
  <circle cx="200" cy="200" r="4" class="accent" />
  <rect x="195" y="195" width="10" height="10" class="line" fill="none" />
  
  <text x="20" y="30" class="meta">FIG. 01</text>
  <text x="340" y="380" class="meta">MAPPING</text>
</svg>
