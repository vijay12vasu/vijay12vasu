<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 300; font-size: 16px; fill: #78716c; letter-spacing: 1px; }
      .line { stroke: #e7e5e4; stroke-width: 1; fill: none; }
      .node { fill: #d97706; }
      
      @media (prefers-color-scheme: dark) {
        .title { fill: #a8a29e; }
        .line { stroke: #292524; }
        .node { fill: #fbbf24; }
      }
    </style>
  </defs>

  <rect width="800" height="200" fill="transparent" />

  <!-- Asymmetric geometric map -->
  <path d="M 120 100 L 680 100" class="line" />
  
  <path d="M 250 100 L 250 50 L 300 50" class="line" />
  <path d="M 400 100 L 400 150 L 450 150" class="line" />
  <path d="M 550 100 L 550 60 L 600 60" class="line" />

  <!-- Nodes -->
  <circle cx="120" cy="100" r="3" class="node" />
  <circle cx="310" cy="50" r="3" class="node" />
  <circle cx="460" cy="150" r="3" class="node" />
  <circle cx="610" cy="60" r="3" class="node" />
  <circle cx="680" cy="100" r="3" class="node" />

  <!-- Labels -->
  <text x="325" y="55" class="title">How things work underneath</text>
  <text x="475" y="155" class="title">AI &amp; Automation</text>
  <text x="625" y="65" class="title">Security</text>
  <text x="135" y="90" class="title">Performance</text>
  <text x="695" y="105" class="title">Systems</text>
</svg>
