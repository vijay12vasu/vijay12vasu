<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -1px; }
      .statement { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 14px; fill: #8b949e; }
      .highlight { fill: #60a5fa; }
      .line { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
    </style>
  </defs>

  <!-- Base -->
  <rect width="800" height="220" fill="#0d1117" rx="6" />
  
  <!-- Patterns -->
  <rect width="800" height="220" fill="url(#dot-grid)" rx="6" />
  <rect width="800" height="220" fill="url(#glow)" rx="6" />

  <!-- Abstract architectural lines -->
  <path d="M 40 0 L 40 220 M 760 0 L 760 220" class="line" stroke-dasharray="4 4" />
  <path d="M 0 180 L 800 180" class="line" />
  <rect x="40" y="179" width="30" height="2" fill="#60a5fa" opacity="0.6" />

  <text x="60" y="90" class="name">Vijay.</text>
  <text x="60" y="130" class="statement">builder <tspan fill="#484f58">|</tspan> student <tspan fill="#484f58">|</tspan> figuring out how things actually work underneath</text>
  
  <!-- Minimal coordinate/status marker -->
  <text x="60" y="202" style="font-family: monospace; font-size: 10px; fill: #484f58; letter-spacing: 1px;">0xCURIOUS // LEARNING THROUGH BREAKING THINGS</text>
  
  <!-- Abstract Node -->
  <circle cx="700" cy="110" r="40" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="700" cy="110" r="25" fill="none" stroke="#60a5fa" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 4" />
  <circle cx="700" cy="110" r="4" fill="#60a5fa" opacity="0.8" />
</svg>
