<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 300; font-size: 48px; fill: #ececed; letter-spacing: 4px; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 300; font-size: 16px; fill: #a1a1aa; line-height: 1.6; }
      .meta { font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; fill: #52525b; letter-spacing: 2px; text-transform: uppercase; }
      .line { stroke: #27272a; stroke-width: 1; }
    </style>
  </defs>

  <!-- Deep minimalist background -->
  <rect width="800" height="300" fill="#09090b" />
  
  <!-- Subtle asymmetric grid -->
  <path d="M 60 0 L 60 300 M 740 0 L 740 300" class="line" stroke-dasharray="1 5" />
  <path d="M 0 240 L 800 240" class="line" />

  <!-- Elegant abstract geometry -->
  <circle cx="680" cy="90" r="80" fill="none" stroke="#18181b" stroke-width="2" />
  <circle cx="680" cy="90" r="30" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4 8" />
  <circle cx="680" cy="90" r="2" fill="#d4d4d8" />

  <!-- Name -->
  <text x="80" y="100" class="name">VIJAY</text>
  
  <!-- Core Identity Statement -->
  <text x="80" y="150" class="body">I am curious about what happens underneath.</text>
  <text x="80" y="175" class="body">I learn by taking systems apart to see why they break.</text>

  <!-- Meta details -->
  <text x="80" y="270" class="meta">01 — DIGITAL IDENTITY</text>
  <text x="635" y="270" class="meta">OBSERVE / BUILD</text>
  
  <!-- Tiny accent -->
  <rect x="80" y="239" width="30" height="2" fill="#a1a1aa" />
</svg>
