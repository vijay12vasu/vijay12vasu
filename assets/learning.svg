<svg width="800" height="100" viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 300; font-size: 12px; fill: #a1a1aa; text-anchor: middle; letter-spacing: 1px; text-transform: uppercase; }
      .arrow { stroke: #27272a; stroke-width: 1; fill: none; }
      .accent { stroke: #38bdf8; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <rect width="800" height="100" fill="#09090b" />
  
  <text x="100" y="54" class="node">Curious</text>
  <text x="250" y="54" class="node">Try</text>
  <text x="400" y="54" class="node">Break</text>
  <text x="550" y="54" class="node" fill="#ececed">Understand</text>
  <text x="700" y="54" class="node">Rebuild</text>

  <path d="M 140 50 L 220 50" class="arrow" />
  <path d="M 280 50 L 360 50" class="arrow" />
  <path d="M 430 50 L 490 50" class="arrow" />
  <path d="M 605 50 L 660 50" class="arrow accent" />
  
  <!-- Loop -->
  <path d="M 700 70 L 700 85 L 100 85 L 100 70" class="arrow" />
  <polygon points="100,70 97,75 103,75" fill="#27272a" />
</svg>
