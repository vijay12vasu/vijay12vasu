<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 300; font-size: 14px; fill: #78716c; letter-spacing: 2px; text-transform: uppercase; text-anchor: middle; }
      .arrow { stroke: #e7e5e4; stroke-width: 1; fill: none; }
      .accent-stroke { stroke: #d97706; }
      
      @media (prefers-color-scheme: dark) {
        .node { fill: #a8a29e; }
        .arrow { stroke: #292524; }
        .accent-stroke { stroke: #fbbf24; }
      }
    </style>
  </defs>

  <rect width="800" height="120" fill="transparent" />

  <!-- Flow -->
  <text x="120" y="65" class="node">Curious</text>
  <text x="260" y="65" class="node">Try</text>
  <text x="400" y="65" class="node">Break</text>
  <text x="540" y="65" class="node" style="font-weight: 500;">Understand</text>
  <text x="680" y="65" class="node">Rebuild</text>

  <path d="M 165 60 L 235 60" class="arrow" />
  <path d="M 285 60 L 365 60" class="arrow" />
  <path d="M 435 60 L 490 60" class="arrow" />
  <path d="M 590 60 L 640 60" class="arrow accent-stroke" />

  <!-- Feedback Loop -->
  <path d="M 680 80 L 680 95 L 120 95 L 120 80" class="arrow" stroke-dasharray="2 4" />
</svg>
