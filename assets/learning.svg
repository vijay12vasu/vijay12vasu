<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { stroke: #e7e5e4; stroke-width: 1; fill: none; }
      .line-dashed { stroke: #d6d3d1; stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
      .accent { fill: #d97706; }
      .meta { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        font-size: 10px; 
        font-weight: 600; 
        fill: #78716c; 
        letter-spacing: 1px; 
        text-transform: uppercase; 
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        font-size: 12px; 
        font-weight: 600; 
        fill: #1c1917; 
      }
      
      @media (prefers-color-scheme: dark) {
        .line { stroke: #292524; }
        .line-dashed { stroke: #44403c; }
        .accent { fill: #fbbf24; }
        .meta { fill: #a8a29e; }
        .node-text { fill: #f5f5f4; }
      }
    </style>
  </defs>

  <!-- Flow Path -->
  <path d="M 100 80 L 100 320 L 300 320 L 300 200 L 200 200" class="line" />
  <path d="M 200 200 L 200 80 L 100 80" class="line-dashed" />
  
  <rect x="40" y="40" width="320" height="320" class="line" />

  <!-- Nodes -->
  <rect x="80" y="60" width="40" height="40" fill="#f5f5f4" class="line" />
  <text x="140" y="85" class="node-text">CURIOUS</text>
  <text x="140" y="70" class="meta">01</text>
  
  <rect x="80" y="300" width="40" height="40" fill="#f5f5f4" class="line" />
  <text x="140" y="325" class="node-text">BREAK</text>
  <text x="140" y="310" class="meta">02</text>
  
  <rect x="280" y="300" width="40" height="40" fill="#f5f5f4" class="line" />
  <text x="210" y="325" class="node-text">UNDERSTAND</text>
  <text x="210" y="310" class="meta">03</text>
  
  <rect x="280" y="180" width="40" height="40" fill="#f5f5f4" class="line" />
  <text x="340" y="205" class="node-text">REBUILD</text>
  <text x="340" y="190" class="meta">04</text>
  
  <circle cx="200" cy="200" r="4" class="accent" />

  <!-- Micro Details -->
  <text x="50" y="55" class="meta">PROCESS</text>
  <text x="325" y="355" class="meta">ITER.01</text>
  <path d="M 40 340 L 60 340 M 340 40 L 360 40" class="line" />
</svg>
