<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name { font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif; font-size: 42px; fill: #1c1917; font-weight: 400; letter-spacing: -0.5px; }
      .statement { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 300; font-size: 16px; fill: #57534e; letter-spacing: 0.5px; }
      .line { stroke: #e7e5e4; stroke-width: 1; }
      
      @media (prefers-color-scheme: dark) {
        .name { fill: #f5f5f4; }
        .statement { fill: #a8a29e; }
        .line { stroke: #292524; }
        .bg { fill: #0c0a09; }
      }
    </style>
  </defs>

  <!-- Background (Transparent by default for GitHub blending, but explicitly styled for dark mode if supported) -->
  <rect width="800" height="280" fill="transparent" class="bg" />

  <!-- A single, delicate architectural line -->
  <path d="M 100 0 L 100 280" class="line" />
  
  <text x="140" y="140" class="name">Vijayaragavan R</text>
  
  <text x="142" y="185" class="statement">I don't want to simply memorize how something works.</text>
  <text x="142" y="215" class="statement">I want to understand why it works.</text>
</svg>
