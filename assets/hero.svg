<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name { 
        font-family: "Avenir Next", Avenir, "Century Gothic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        font-weight: 700; 
        font-size: 48px; 
        fill: #1c1917; 
        letter-spacing: -1.5px; 
      }
      .statement { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        font-size: 15px; 
        font-weight: 400; 
        fill: #78716c; 
        letter-spacing: 0.2px; 
      }
      .line { stroke: #e7e5e4; stroke-width: 1; }
      .accent { fill: #d97706; }
      .meta { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        font-size: 10px; 
        font-weight: 600; 
        fill: #a8a29e; 
        letter-spacing: 2px; 
        text-transform: uppercase; 
      }
      
      @media (prefers-color-scheme: dark) {
        .name { fill: #f5f5f4; }
        .statement { fill: #a8a29e; }
        .line { stroke: #292524; }
        .accent { fill: #fbbf24; }
        .meta { fill: #52525b; }
      }
    </style>
  </defs>

  <rect width="800" height="260" fill="transparent" />
  
  <path d="M 80 0 L 80 260 M 720 0 L 720 260" class="line" stroke-dasharray="1 6" />
  <path d="M 0 220 L 800 220" class="line" />

  <text x="120" y="115" class="name">Vijayaragavan R</text>
  
  <text x="120" y="185" class="statement">I want to understand the layer underneath.</text>

  <circle cx="680" cy="110" r="40" fill="none" class="line" />
  <circle cx="680" cy="110" r="15" fill="none" class="line" stroke-dasharray="4 4" />
  <circle cx="680" cy="110" r="3" class="accent" />
  
  <text x="120" y="245" class="meta">Identity Layer</text>
  <text x="635" y="245" class="meta">Observe / Build</text>
</svg>
