<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -2px;
        fill: #1c1917;
      }
      .wordmark-shadow {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -2px;
        fill: none;
        stroke: #e7e5e4;
        stroke-width: 1px;
        transform: translate(6px, 6px);
      }
      .grid-line {
        stroke: #e7e5e4;
        stroke-width: 1px;
      }
      .grid-line-subtle {
        stroke: #f5f5f4;
        stroke-width: 1px;
      }
      .micro-text {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #a8a29e;
        text-transform: uppercase;
      }
      .accent { fill: #d97706; }
      .accent-glow { fill: #d97706; opacity: 0.2; }
      
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f5f5f4; }
        .wordmark-shadow { stroke: #292524; }
        .grid-line { stroke: #292524; }
        .grid-line-subtle { stroke: #1c1917; }
        .micro-text { fill: #52525b; }
      }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line-subtle" />
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="320" fill="url(#grid)" />
  
  <!-- Architectural Lines -->
  <path d="M 60 0 L 60 320 M 740 0 L 740 320" class="grid-line" stroke-dasharray="2 4" />
  <path d="M 0 240 L 800 240 M 0 80 L 800 80" class="grid-line" />

  <!-- Coordinates & Micro Data -->
  <text x="68" y="72" class="micro-text">SYS.ID // V.R.01</text>
  <text x="732" y="72" class="micro-text" text-anchor="end">LAT:43.082</text>
  <text x="68" y="232" class="micro-text">INIT: 2026</text>
  <text x="732" y="232" class="micro-text" text-anchor="end">STATUS: ACTIVE</text>
  <text x="68" y="258" class="micro-text">I WANT TO UNDERSTAND THE LAYER UNDERNEATH.</text>

  <!-- Node Elements -->
  <circle cx="60" cy="80" r="3" class="grid-line" fill="none" />
  <circle cx="740" cy="80" r="3" class="grid-line" fill="none" />
  <circle cx="60" cy="240" r="3" class="grid-line" fill="none" />
  <circle cx="740" cy="240" r="3" class="accent" />
  <circle cx="740" cy="240" r="12" class="accent-glow" filter="url(#blur)" />

  <!-- Dynamic Geometry -->
  <path d="M 640 120 L 700 120 L 700 180" fill="none" class="grid-line" />
  <rect x="638" y="118" width="4" height="4" class="grid-line" fill="none" />

  <!-- The Identity Wordmark with Dimensional Shadow -->
  <text x="54" y="176" class="wordmark-shadow">Vijayaragavan R</text>
  <text x="60" y="170" class="wordmark">Vijayaragavan R</text>
</svg>
