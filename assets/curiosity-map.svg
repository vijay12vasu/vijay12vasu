<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #d4d4d8; }
      .meta { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9px; fill: #52525b; letter-spacing: 1px; }
      .box { fill: #09090b; stroke: #27272a; stroke-width: 1; rx: 4; }
      .connect { stroke: #27272a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="800" height="150" fill="#09090b" />

  <!-- Center Node -->
  <circle cx="400" cy="75" r="4" fill="#38bdf8" />
  <circle cx="400" cy="75" r="15" fill="none" stroke="#38bdf8" stroke-opacity="0.2" />

  <!-- Connecting Lines -->
  <path d="M 400 75 L 250 40" class="connect" />
  <path d="M 400 75 L 250 110" class="connect" />
  <path d="M 400 75 L 550 40" class="connect" />
  <path d="M 400 75 L 550 110" class="connect" />

  <!-- Node: How things work underneath -->
  <rect x="50" y="25" width="200" height="30" class="box" />
  <text x="150" y="44" class="label" text-anchor="middle">How Things Work Underneath</text>

  <!-- Node: AI Automation -->
  <rect x="50" y="95" width="200" height="30" class="box" />
  <text x="150" y="114" class="label" text-anchor="middle">Local AI &amp; Automation</text>

  <!-- Node: Security & State -->
  <rect x="550" y="25" width="200" height="30" class="box" />
  <text x="650" y="44" class="label" text-anchor="middle">Security &amp; Persistence</text>

  <!-- Node: System Architecture -->
  <rect x="550" y="95" width="200" height="30" class="box" />
  <text x="650" y="114" class="label" text-anchor="middle">Software Architecture</text>
</svg>
