<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 300; font-size: 14px; fill: #78716c; letter-spacing: 1px; }
      .circle { fill: none; stroke: #e7e5e4; stroke-width: 1; }
      
      @media (prefers-color-scheme: dark) {
        .word { fill: #a8a29e; }
        .circle { stroke: #292524; }
      }
    </style>
  </defs>

  <rect width="800" height="200" fill="transparent" />

  <!-- Soft organic overlapping circles indicating intersections of thought -->
  <circle cx="280" cy="100" r="60" class="circle" />
  <circle cx="400" cy="100" r="80" class="circle" />
  <circle cx="520" cy="100" r="60" class="circle" />

  <!-- Words scattered organically but elegantly -->
  <text x="210" y="80" class="word">Systems</text>
  <text x="230" y="140" class="word">Chess</text>
  
  <text x="360" y="60" class="word">Software</text>
  <text x="385" y="105" class="word">AI</text>
  <text x="350" y="150" class="word">Problem Solving</text>

  <text x="510" y="80" class="word">Communication</text>
  <text x="490" y="130" class="word">Language</text>
</svg>
