<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <pattern id="micro-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.75" fill="#52525b" opacity="0.3"/>
    </pattern>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 56px; fill: #f4f4f5; letter-spacing: -2px; }
      .statement { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 15px; fill: #a1a1aa; letter-spacing: -0.2px; }
      .mono-small { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 10px; fill: #52525b; letter-spacing: 1px; text-transform: uppercase; }
      .accent { fill: #38bdf8; }
      .line { stroke: #27272a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="800" height="260" fill="#09090b" />
  <rect width="800" height="260" fill="url(#micro-grid)" />
  <rect width="400" height="260" x="400" fill="url(#fade)" />

  <!-- Structural Lines -->
  <path d="M 0 220 L 800 220" class="line" />
  <path d="M 50 0 L 50 260" class="line" stroke-dasharray="2 4" />
  <rect x="50" y="219" width="40" height="2" fill="#38bdf8" opacity="0.8" />
  
  <text x="80" y="110" class="title">VIJAY<tspan class="accent">.</tspan></text>
  <text x="80" y="150" class="statement">I like understanding systems rather than merely using them.</text>
  
  <!-- Subtle asymmetric elements -->
  <circle cx="700" cy="90" r="60" fill="none" stroke="#27272a" stroke-width="1" />
  <circle cx="700" cy="90" r="40" fill="none" stroke="#52525b" stroke-width="1" stroke-dasharray="2 6" opacity="0.5" />
  <circle cx="720" cy="70" r="3" fill="#38bdf8" opacity="0.7" />
  <path d="M 720 70 L 760 30" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  <text x="765" y="32" class="mono-small">OBSERVE</text>

  <!-- Meta footer -->
  <text x="80" y="240" class="mono-small">IDENTITY LAYER // CSE STUDENT // BUILDER</text>
  <text x="690" y="240" class="mono-small">V. 01.00</text>
</svg>
